[project]
name = "companyai-backend"
version = "0.1.0"
description = "Gemini chatbot backend with LangGraph and FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false
