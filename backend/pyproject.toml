[project]
name = "companyai-backend"
version = "0.1.0"
description = "Chatbot backend with LangGraph, Gemini, and Ollama fallback"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.5.5",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-google-genai>=4.3.4",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
    "langchain-ollama>=0.3.0",
    "aiosqlite>=0.22.1",
    "pypdf>=5.0.0",
    "docx2txt>=0.8",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
]

[tool.uv]
package = false

